<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/c8c917a1e5.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #fdfbf7; padding: 20px; font-family: 'Quicksand', sans-serif; }
    .admin-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
    button { background: #d97706; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #b45309; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status-msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-section" class="admin-container">
    <h2><i class="fa-solid fa-lock"></i> Teacher Access</h2>
    <p>Please enter the passphrase to publish tips.</p>
    <div class="form-group">
      <input type="password" id="admin-pass" placeholder="Enter Access Code" />
    </div>
    <button onclick="checkPassphrase()">Login</button>
    <p id="login-err" class="status-msg" style="color: #ef4444;"></p>
  </div>

  <!-- 2. PUBLISH FORM (HIDDEN UNTIL AUTHENTICATED) -->
  <div id="editor-section" class="admin-container hidden">
    <h2><i class="fa-solid fa-pen-to-square"></i> Publish New Tip</h2>
    <form id="tip-form" onsubmit="publishTip(event)">
      <div class="form-group">
        <label for="tip-subject">Subject Category</label>
        <select id="tip-subject" required>
          <option value="BM">Bahasa Melayu</option>
          <option value="English">English</option>
          <option value="Math">Mathematics</option>
          <option value="Science">Science</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tip-title">Tip Title</label>
        <input type="text" id="tip-title" placeholder="e.g., How to solve quadratic equations" required />
      </div>

      <div class="form-group">
        <label for="tip-content">Tip Description / Steps</label>
        <textarea id="tip-content" rows="5" placeholder="Write your tip here..." required></textarea>
      </div>

      <button type="submit" id="submit-btn">Publish to Main Site</button>
    </form>
    <p id="pub-status" class="status-msg"></p>
  </div>

  <script>
    // Initialize Supabase Client
    const SUPABASE_URL = "https://dufdnzwprojhrnfbhvhc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1ZmRuendwcm9qaHJuZmJodmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDg1NTYsImV4cCI6MjEwMTEyNDU1Nn0.pqAFoGdEnXO5OH78UlPQlWZKUWSz3KDZOllWGaoD64s";
    
    // Global client instance assigned to 'supabaseClient' to avoid variable shadowing with window.supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Simple client-side passphrase protection
    const ACCESS_CODE = "tahu123";

    function checkPassphrase() {
      const input = document.getElementById('admin-pass').value;
      if (input === ACCESS_CODE) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('editor-section').classList.remove('hidden');
      } else {
        document.getElementById('login-err').textContent = "Incorrect code! Access denied.";
      }
    }

    async function publishTip(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const status = document.getElementById('pub-status');
      
      // UI Feedback: Pending
      submitBtn.disabled = true;
      status.style.color = "#d97706";
      status.textContent = "Publishing...";

      const subject = document.getElementById('tip-subject').value;
      const title = document.getElementById('tip-title').value;
      const content = document.getElementById('tip-content').value;

      // Insert record into Supabase 'tips' table
      const { data, error } = await supabaseClient
        .from('tips')
        .insert([{ subject, title, content }]);

      submitBtn.disabled = false;

      if (error) {
        status.style.color = "#ef4444";
        status.textContent = "Error publishing: " + error.message;
      } else {
        status.style.color = "#16a34a";
        status.textContent = "Published successfully!";
        document.getElementById('tip-form').reset();
      }
    }
  </script>
</body>
</html>
